<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Login</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family:
          Segoe UI,
          Arial,
          sans-serif;
      }

      body {
        height: 100vh;
        background: radial-gradient(
          circle at center,
          #0a6fc2 60%,
          #085ea0 100%
        );
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .login-container {
        background: #fff;
        padding: 50px;
        width: 420px; /* slightly smaller than register */
        border-radius: 20px; /* clean round edges */
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
        text-align: center;
      }

      .login-container h2 {
        margin-bottom: 35px;
        color: #0a6fc2;
        font-size: 30px; /* large but balanced */
        font-weight: bold;
      }

      .input-group {
        margin-bottom: 25px;
        text-align: left;
      }

      .input-group label {
        font-size: 18px;
        color: #033966;
        font-weight: 600;
      }

      .input-group input {
        width: 100%;
        padding: 16px;
        margin-top: 10px;
        border-radius: 10px;
        border: 2px solid #ccc;
        outline: none;
        font-size: 16px;
      }

      .input-group input:focus {
        border-color: #0a6fc2;
      }

      .login-btn {
        width: 100%;
        padding: 20px;
        background: #0a6fc2;
        color: #fff;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        margin-top: 20px;
        font-size: 20px;
        font-weight: bold;
      }

      .login-btn:hover {
        background: #085ea0;
      }

      .signup-link {
        margin-top: 20px;
        font-size: 16px;
      }

      .signup-link a {
        color: #0d50a9;
        text-decoration: none;
        font-weight: bold;
      }

      .signup-link a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="login-container">
      <h2>Login</h2>

      <form onsubmit="redirectToHome(event)">
        <div class="input-group">
          <label>Email</label>
          <input type="email" required placeholder="Enter your email" />
        </div>

        <div class="input-group">
          <label>Password</label>
          <input type="password" required placeholder="Enter your password" />
        </div>

        <button type="submit" class="login-btn">Login</button>
      </form>

      <div class="signup-link">
        Don't have an account?
        <a href="register.html">Sign Up</a>
      </div>
    </div>

    <script>
      function redirectToHome(event) {
        event.preventDefault();
        window.location.href = "index.html";
      }
    </script>
  </body>
</html>
