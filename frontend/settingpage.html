<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>Settings Page</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        background-color: #f4f4f4;
      }
      .sidebar {
        width: 200px;
        background: #333;
        color: #fff;
        height: 100vh;
        position: fixed;
        padding-top: 20px;
      }
      .sidebar a {
        display: block;
        padding: 10px;
        color: #fff;
        text-decoration: none;
      }
      .sidebar a:hover {
        background: #444;
      }
      .main {
        margin-left: 220px;
        padding: 20px;
      }
      .card {
        background: #fff;
        padding: 20px;
        width: 1000px;
        border-radius: 5px;
        margin-bottom: 20px;
        text-align: left;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      }
      input[type="password"] {
        width: 1000px;
        padding: 14px;
        margin: 8px 0;
        border: 1px solid #ccc;
        border-radius: 4px;
      }
      button {
        padding: 20px 25px;
        border: none;
        text-align: center;
        border-radius: 6px;
        cursor: pointer;
        display: block;
        margin: 0 auto;
        font-size: 16px;
        margin-top: 10px;
        margin-bottom: 10px;
      }
      .update-btn {
        background: #007bff;
        color: #fff;
      }
      .delete-btn {
        background: #dc3545;
        color: #fff;
      }
      .hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <nav class="sidebar">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="drafts.html">My Drafts</a></li>
        <li><a href="/resume_template.html">Templates</a></li>
        <li><a href="profiles.html">Profiles</a></li>
        <li><a href="notifications.html">Notifications</a></li>
        <li><a href="settings.html">Settings</a></li>
      </ul>
    </nav>

    <div class="main">
      <h1>Account Settings</h1>

      <div class="card">
        <h2>Change Password</h2>
        <!-- Button to show form -->
        <button class="update-btn" onclick="togglePasswordForm()">
          Change Password
        </button>

        <!-- Hidden form -->
        <div id="passwordForm" class="hidden">
          <input type="password" placeholder="New Password" /><br /><br />
          <input type="password" placeholder="Confirm Password" /><br /><br />
          <button class="update-btn">Update Password</button>
        </div>
      </div>

      <div class="card">
        <h2>Notification Settings</h2>
        <label><input type="checkbox" /> Email Notifications</label><br />
        <label><input type="checkbox" /> SMS Notifications</label><br />
        <button class="update-btn">Save Preferences</button>
      </div>

      <div class="card">
        <h2>Delete Account</h2>
        <p>Warning: This action cannot be undone.</p>
        <button class="delete-btn">Delete Account</button>
      </div>
    </div>

    <script>
      function togglePasswordForm() {
        const form = document.getElementById("passwordForm");
        form.classList.toggle("hidden");
      }
    </script>
  </body>
</html>
